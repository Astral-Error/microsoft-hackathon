<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Libraria</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center bg-light" style="height: 100vh;">

    <div class="card shadow-sm border-0 p-4" style="width: 100%; max-width: 400px; border-radius: 12px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">Libraria</h2>
            <p class="text-muted">Sign in to your account</p>
        </div>

        <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

        <form id="login-form" novalidate>
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" placeholder="Username" required minlength="3">
                <label for="username">Username</label>
                <div class="invalid-feedback">
                    Please provide a valid username.
                </div>
            </div>
            
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" placeholder="Password" required minlength="5">
                <label for="password">Password</label>
                <div class="invalid-feedback">
                    Password must be at least 5 characters.
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Sign In</button>
        </form>

        <div class="mt-4 text-center text-muted" style="font-size: 0.85rem;">
            <p class="mb-1">Demo Credentials:</p>
            <p class="mb-0">Member: student / student123</p>
            <p>Admin: librarian / admin123</p>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
